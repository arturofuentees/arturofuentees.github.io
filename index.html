<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arturo Fuentes Coria | CV y Consultoría</title>
  <meta id="metaDescription" name="description" content="CV profesional y servicios de consultoría de Arturo Fuentes Coria." />

  <style>
    :root,[data-theme="light"]{
      --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
      --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
      --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
      --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
      --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --text-2xl:clamp(2rem,1.2rem + 2.5vw,3.5rem);

      --space-2:.5rem;
      --space-3:.75rem;
      --space-4:1rem;
      --space-5:1.25rem;
      --space-6:1.5rem;
      --space-8:2rem;
      --space-10:2.5rem;

      --color-bg:#f7f6f2;
      --color-surface:#fbfbf9;
      --color-surface-2:#f0ede8;
      --color-border:#d8d3cb;
      --color-text:#25211b;
      --color-text-muted:#6f6b64;
      --color-text-inverse:#f8f7f4;
      --color-primary:#01696f;
      --color-primary-hover:#0c4e54;
      --color-primary-soft:#dfeceb;
      --color-blue:#006494;

      --radius-lg:1.25rem;
      --radius-xl:1.75rem;
      --radius-full:9999px;

      --shadow-sm:0 1px 2px rgba(28,22,16,.06);
      --shadow-md:0 10px 30px rgba(28,22,16,.09);

      --transition:180ms cubic-bezier(.16,1,.3,1);
      --content-wide:1180px;
    }

    [data-theme="dark"]{
      --color-bg:#141311;
      --color-surface:#1c1b19;
      --color-surface-2:#23211f;
      --color-border:#393632;
      --color-text:#e4e0d9;
      --color-text-muted:#b0aaa1;
      --color-text-inverse:#171513;
      --color-primary:#63a9b1;
      --color-primary-hover:#88bdc3;
      --color-primary-soft:#223132;
      --color-blue:#75acd5;
      --shadow-sm:0 1px 2px rgba(0,0,0,.2);
      --shadow-md:0 10px 30px rgba(0,0,0,.28);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      -webkit-font-smoothing:antialiased;
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at top right,rgba(1,105,111,.08),transparent 30%),
        radial-gradient(circle at left 20%,rgba(0,100,148,.06),transparent 25%),
        var(--color-bg);
      color:var(--color-text);
      font-family:Arial,Helvetica,sans-serif;
      font-size:var(--text-base);
      line-height:1.6;
    }

    img,svg{
      display:block;
      max-width:100%;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font:inherit;
      border:0;
      background:none;
      color:inherit;
      cursor:pointer;
    }

    .page{
      max-width:var(--content-wide);
      margin:0 auto;
      padding:var(--space-6);
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:var(--space-4);
      padding:var(--space-4) 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:var(--space-3);
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:14px;
      background:linear-gradient(
        135deg,
        var(--color-primary),
        var(--color-blue)
      );
      display:grid;
      place-items:center;
      color:white;
      box-shadow:var(--shadow-sm);
    }

    .logo svg{
      width:24px;
      height:24px;
    }

    .brand-text strong{
      display:block;
      font-size:var(--text-sm);
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .brand-text span{
      display:block;
      color:var(--color-text-muted);
      font-size:var(--text-xs);
    }

    .controls{
      display:flex;
      gap:var(--space-2);
      flex-wrap:wrap;
    }

    .control-btn,
    .lang-btn{
      min-width:44px;
      min-height:44px;
      padding:0 var(--space-4);
      border:1px solid var(--color-border);
      border-radius:var(--radius-full);
      background:var(--color-surface);
      transition:all var(--transition);
    }

    .control-btn:hover,
    .lang-btn:hover,
    .lang-btn.active{
      background:var(--color-primary);
      color:var(--color-text-inverse);
      border-color:var(--color-primary);
    }

    .hero{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:var(--space-8);
      align-items:stretch;
      padding:var(--space-8) 0 var(--space-10);
    }

    .hero-copy,
    .photo-card,
    .contact-card,
    .kpi-card,
    .panel,
    .consulting-wrapper{
      background:var(--color-surface);
      border:1px solid var(--color-border);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow-md);
    }

    .hero-copy{
      padding:var(--space-8);
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:var(--space-2);
      padding:var(--space-2) var(--space-4);
      border-radius:var(--radius-full);
      background:var(--color-primary-soft);
      color:var(--color-primary);
      font-size:var(--text-xs);
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    h1{
      font-size:var(--text-2xl);
      line-height:1.02;
      margin-top:var(--space-6);
      text-align:center;
    }

    .headline{
      font-size:var(--text-lg);
      color:var(--color-text-muted);
      margin-top:var(--space-4);
      text-align:justify;
    }

    .intro{
      margin-top:var(--space-5);
      text-align:justify;
    }

    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:var(--space-3);
      margin-top:var(--space-6);
    }

    .chip{
      padding:var(--space-2) var(--space-4);
      border-radius:var(--radius-full);
      background:var(--color-surface-2);
      border:1px solid var(--color-border);
      font-size:var(--text-sm);
    }

    .hero-side{
      display:grid;
      gap:var(--space-4);
    }

    .photo-card{
      padding:var(--space-5);
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .photo-frame{
      width:200px;
      height:250px;
      border-radius:calc(var(--radius-xl) - var(--space-3));
      overflow:hidden;
      background:var(--color-surface-2);
      border:1px solid var(--color-border);
      position:relative;
    }

    .photo-frame::before{
      content:'';
      position:absolute;
      inset:12px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,.25);
      pointer-events:none;
      z-index:2;
    }

    .photo-frame img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .photo-note{
      margin-top:var(--space-4);
      color:var(--color-text-muted);
      font-size:var(--text-sm);
    }

    .contact-card,
    .kpi-card{
      padding:var(--space-5);
    }

    .section-title{
      font-size:var(--text-xs);
      letter-spacing:.08em;
      text-transform:uppercase;
      color:var(--color-primary);
      font-weight:800;
      margin-bottom:var(--space-3);
    }

    .metric{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:var(--space-3);
    }

    .metric div{
      padding:var(--space-4);
      border-radius:var(--radius-lg);
      background:var(--color-surface-2);
      border:1px solid var(--color-border);
    }

    .metric strong{
      display:block;
      font-size:var(--text-xl);
    }

    .metric span{
      display:block;
      color:var(--color-text-muted);
      font-size:var(--text-sm);
    }

    .contact-list{
      display:grid;
      gap:var(--space-3);
    }

    .contact-list a:hover{
      color:var(--color-primary);
    }

    .whatsapp-btn{
      display:inline-flex;
      align-items:center;
      gap:var(--space-2);
      padding:var(--space-2) var(--space-4);
      background:#25D366;
      color:#fff !important;
      border-radius:var(--radius-full);
      font-size:var(--text-sm);
      font-weight:700;
      width:fit-content;
    }

    .whatsapp-btn:hover{
      background:#1ebe5d;
    }

    .consulting-wrapper{
      padding:var(--space-8);
      margin-bottom:var(--space-8);
      border:2px solid
        color-mix(
          in srgb,
          var(--color-primary) 45%,
          var(--color-border)
        );
      background:
        linear-gradient(
          135deg,
          color-mix(
            in srgb,
            var(--color-primary-soft) 42%,
            var(--color-surface)
          ),
          var(--color-surface)
        );
    }

    .consulting-wrapper h2,
    .panel h2{
      font-size:var(--text-xl);
      margin-bottom:var(--space-4);
    }

    .consulting-intro{
      max-width:900px;
      color:var(--color-text-muted);
      margin-bottom:var(--space-6);
      text-align:justify;
    }

    .consulting-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:var(--space-5);
    }

    .consulting-card{
      padding:var(--space-6);
      background:var(--color-surface);
      border:1px solid var(--color-border);
      border-radius:var(--radius-lg);
      transition:
        transform var(--transition),
        box-shadow var(--transition);
    }

    .consulting-card:hover{
      transform:translateY(-4px);
      box-shadow:var(--shadow-md);
    }

    .consulting-icon{
      width:48px;
      height:48px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:var(--color-primary-soft);
      color:var(--color-primary);
      font-weight:900;
      margin-bottom:var(--space-4);
    }

    .consulting-card h3{
      font-size:var(--text-lg);
      margin-bottom:var(--space-3);
    }

    .consulting-card p{
      color:var(--color-text-muted);
      text-align:justify;
    }

    .consulting-card ul{
      margin-top:var(--space-4);
      padding-left:1.2rem;
    }

    .consulting-card li{
      margin-bottom:var(--space-2);
    }

    .cta-box{
      margin-top:var(--space-6);
      padding:var(--space-5);
      border-radius:var(--radius-lg);
      background:var(--color-primary);
      color:white;
      display:flex;
      justify-content:space-between;
      gap:var(--space-4);
      align-items:center;
      flex-wrap:wrap;
    }

    .cta-button{
      padding:var(--space-3) var(--space-5);
      background:white;
      color:var(--color-primary);
      border-radius:var(--radius-full);
      font-weight:800;
    }

    .section-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:var(--space-6);
      padding-bottom:var(--space-8);
    }

    .panel{
      padding:var(--space-6);
    }

    .timeline{
      display:grid;
      gap:var(--space-5);
    }

    .job{
      padding-bottom:var(--space-5);
      border-bottom:1px solid var(--color-border);
    }

    .job:last-child{
      border-bottom:0;
      padding-bottom:0;
    }

    .job-top{
      display:flex;
      justify-content:space-between;
      gap:var(--space-4);
      flex-wrap:wrap;
      margin-bottom:var(--space-2);
    }

    .job-role{
      font-weight:900;
    }

    .job-meta{
      color:var(--color-text-muted);
      font-size:var(--text-sm);
    }

    .job p,
    .panel-copy{
      text-align:justify;
    }

    .skills{
      display:flex;
      flex-wrap:wrap;
      gap:var(--space-2);
    }

    .skills span{
      padding:var(--space-2) var(--space-3);
      font-size:var(--text-sm);
      border-radius:var(--radius-full);
      background:var(--color-surface-2);
      border:1px solid var(--color-border);
    }

    .edu-list,
    .cert-list{
      display:grid;
      gap:var(--space-3);
    }

    .footer{
      padding:var(--space-8) 0 var(--space-4);
      color:var(--color-text-muted);
      font-size:var(--text-sm);
      text-align:center;
    }

    @media(max-width:980px){
      .hero,
      .section-grid{
        grid-template-columns:1fr;
      }

      .consulting-grid{
        grid-template-columns:1fr;
      }

      .metric{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:640px){
      .page{
        padding:var(--space-4);
      }

      .topbar{
        align-items:flex-start;
        flex-direction:column;
      }

      .controls{
        width:100%;
      }

      .control-btn,
      .lang-btn{
        flex:1;
      }

      .hero-copy,
      .panel,
      .photo-card,
      .contact-card,
      .kpi-card,
      .consulting-wrapper{
        padding:var(--space-5);
      }

      h1{
        font-size:2rem;
      }
    }
  </style>
</head>

  <script>

    /*
    ==========================================================
    FOTOGRAFÍA ORIGINAL INCRUSTADA
    ==========================================================
